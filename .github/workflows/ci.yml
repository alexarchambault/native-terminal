name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3
        with:
          jvm: "24"
      - run: ./mill __.publishLocal
      - run: ./mill __.mimaReportBinaryIssues

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # JVM the tests run on (Mill itself runs on its own JVM): the minimum supported Java
        # version, the minimum one Mill's test runner supports, and one using the FFM classes
        # of the multi-release JAR (Java >= 22)
        jvm: ["zulu:8", "zulu:11", "zulu:25"]
    env:
      # Java 8 is handled by native.test.consoleTest below (Mill's test runner needs Java 11)
      NATIVE_TERMINAL_TEST_JVM: ${{ matrix.jvm != 'zulu:8' && matrix.jvm || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3
        with:
          jvm: "24"
      - run: ./mill __.test
        if: runner.os != 'Windows' && matrix.jvm != 'zulu:8'
      - run: ./mill.bat __.test
        if: runner.os == 'Windows' && matrix.jvm != 'zulu:8'
      - run: ./mill native.test.consoleTest --jvm ${{ matrix.jvm }}
        if: runner.os != 'Windows' && matrix.jvm == 'zulu:8'
      - run: ./mill.bat native.test.consoleTest --jvm ${{ matrix.jvm }}
        if: runner.os == 'Windows' && matrix.jvm == 'zulu:8'
      # Mill pipes the output of tests, so these never see a terminal: check the terminal size
      # from a main class, run under a pseudo-terminal
      - name: Check terminal size under a pty
        if: runner.os == 'Linux' && matrix.jvm != 'zulu:8'
        run: script -qec "stty cols 120 rows 40 && ./mill --no-daemon native.test.runMain io.github.alexarchambault.nativeterm.TtyCheck 120 40" /dev/null

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # Never publish to Sonatype Central from two jobs at a time. A job waits for the running one
    # rather than cancelling it. GitHub keeps only one waiting job per group though, and cancels
    # an older waiting one.
    concurrency:
      group: sonatype-central-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH_ARTIFACTS: __:PublishModule.publishArtifacts
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3
        with:
          jvm: "24"
      - name: Publish to Sonatype Central
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --bundleName "native-terminal-${GITHUB_REF#refs/tags/v}" --shouldRelease false
          else
            for tag in $(git tag --points-at HEAD); do
              git tag -d "$tag"
            done
            ./mill -i mill.scalalib.SonatypeCentralPublishModule/
          fi
        env:
          MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
          MILL_SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
      - name: Publish to GitHub Packages
        continue-on-error: true
        run: |
          ./mill -i mill.javalib.MavenPublishModule/publishAll \
            --publishArtifacts "$PUBLISH_ARTIFACTS" \
            --releaseUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY" \
            --snapshotUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY"
        env:
          MILL_MAVEN_USERNAME: ${{ github.actor }}
          MILL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
